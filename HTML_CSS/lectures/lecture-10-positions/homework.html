<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logarithm – Position Quiz</title>
<style>
:root{--bg:#0B1F3A;--card:#12294a;--ac:#FF7A1A;--tx:#fff;--mu:#9fb3cf;--ok:#2ecc71;--no:#e74c3c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Cairo","Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 18px}
header b{font-size:20px;letter-spacing:1px}header b span{color:var(--ac)}
.bar{height:5px;background:#1d3a63}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:.3s}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.s{width:100%;max-width:760px;background:var(--card);border-radius:20px;padding:26px;border-top:6px solid var(--ac)}
.tag{color:var(--ac);font-weight:700;font-size:14px}
h1{font-size:30px;margin:8px 0}h2{font-size:24px;margin:10px 0 18px;line-height:1.6}
p{color:var(--mu);font-size:18px;line-height:1.8}
.o{display:block;width:100%;text-align:start;margin:8px 0;padding:13px 16px;font:inherit;font-size:18px;color:var(--tx);background:#0e2342;border:2px solid #24456f;border-radius:12px;cursor:pointer}
.o:hover{border-color:var(--ac)}.o.ok{background:var(--ok);border-color:var(--ok)}.o.no{background:var(--no);border-color:var(--no)}
pre{direction:ltr;text-align:left;background:#07142a;padding:14px;border-radius:12px;font-size:18px;overflow-x:auto;color:#ffd7b3}
.btn{background:var(--ac);color:#fff;border:0;padding:12px 24px;font:inherit;font-size:18px;border-radius:12px;cursor:pointer;margin-top:12px}
footer{display:flex;justify-content:space-between;padding:12px 18px}
footer .btn{margin:0;padding:10px 22px}footer .btn:disabled{opacity:.35}
.big{font-size:64px;color:var(--ac);font-weight:800}
.fb{margin-top:12px;padding:12px 16px;border-radius:12px;font-size:18px;line-height:1.7;background:#0e2342;border-right:5px solid var(--ac)}.fb.g{border-color:var(--ok)}.fb.r{border-color:var(--no)}
.hero{position:relative;height:200px;border-radius:12px;background:linear-gradient(160deg,#1e6fd9,#6cc4ff 60%,#ffd9a0);overflow:hidden;margin:10px 0}.hero .logo{position:absolute;top:10px;right:12px;font-weight:800}.hero .b{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 22px;font:inherit}.hero .bx{position:absolute;top:62%;left:50%;transform:translateX(-50%);width:50%;height:60px;background:#fff;border-radius:8px}
</style>
</head>
<body>
<header>
<svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true"><circle cx="19" cy="19" r="18" fill="#FF7A1A"/><text x="19" y="25" font-size="17" font-weight="800" text-anchor="middle" fill="#0B1F3A" font-family="Arial">log</text></svg>
<b>LOG<span>ARITHM</span></b>
</header>
<div class="bar"><i id="pb"></i></div>
<main><div class="s" id="sl"></div></main>
<footer><button class="btn" id="nx">التالي ←</button><button class="btn" id="pv_">→ السابق</button></footer>
<script>
const E=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const Q=t=>{const p=t.split("\n");return `<h2 dir="rtl">${E(p[0])}</h2>`+(p[1]?`<pre>${E(p.slice(1).join("\n"))}</pre>`:"")};
const mc=[
["الكود ده بيعمل إيه؟\nposition: relative;",["العنصر بيفضل في مكانه وبيبقى نقطة بداية للي جواه","العنصر بيختفي","العنصر بيتثبت على الشاشة","العنصر بيروح آخر الصفحة"],0,"relative بيسيب العنصر في مكانه، وبيبقى نقطة البداية للي جواه."],
["position: absolute بيتحرك بالنسبة لإيه؟",["أقرب أب عليه position","الأخ اللي جنبه","الصفحة دايماً","اللون"],0,"absolute بيدور على أقرب أب عليه position ويتحرك بالنسبة له."],
["لو مفيش أب عليه position، الـ absolute بيتحرك بالنسبة لإيه؟",["الصفحة كلها","العنصر اللي قبله","مفيش مكان","آخر عنصر"],0,"مفيش أب عليه position؟ يبقى بيتحرك بالنسبة للصفحة كلها."],
["عشان top و left يشتغلوا لازم العنصر يبقى عليه إيه؟",["position (غير static)","color","font-size","border"],0,"top و left مبيشتغلوش على static (الوضع الافتراضي)، لازم تحط position."],
["الكود ده بيحدد إيه؟\nz-index: 5;",["مين فوق مين","لون العنصر","حجم العنصر","مكان الأب"],0,"z-index بيقول مين يظهر فوق مين لما العناصر تغطي بعض."],
["عنصر الأول z-index: 1 والتاني z-index: 3. مين فوق؟",["التاني","الأول","الاتنين نفس الحاجة","مفيش فرق"],0,"الرقم الأكبر بيبقى فوق، يعني 3 فوق 1."],
["أنهي كود بيحط badge في ركن الكارت؟",[".card { position: relative; } .badge { position: absolute; }",".card { position: absolute; } .badge { position: relative; }",".card { display: flex; } .badge { z-index: 1; }",".card { color: red; } .badge { top: 0; }"],0,"الأب relative بيبقى المرجع، والابن absolute بيتحرك جواه ويقعد في الركن."],
["العنصر اللي عليه absolute بيحصل له إيه؟",["بيخرج من مكانه الطبيعي والعناصر التانية بتاخد مكانه","بيفضل في مكانه","بيختفي","بيتحول لـ flex"],0,"absolute بيشيل العنصر من الترتيب الطبيعي، فالعناصر اللي بعده بتاخد مكانه."],
["الكود ده بيعمل إيه؟\nposition: relative; top: 20px;",["بينزل العنصر 20px من مكانه الأصلي","بيطلع العنصر 20px فوق","بيخفي العنصر","بيثبت العنصر على الشاشة"],0,"relative مع top: 20px بيزق العنصر لتحت 20px من مكانه الأصلي."],
["z-index بيشتغل على عنصر عليه إيه؟",["position (relative أو absolute...)","color","margin بس","font-size"],0,"z-index مبيشتغلش إلا لو العنصر عليه position."]];
const tf=[
["absolute بيتحرك بالنسبة لأقرب أب عليه position.",true,"أيوه، absolute بيدور على أقرب أب عليه position."],
["الكود ده لوحده بيحرك العنصر من مكانه:\nposition: relative;",false,"relative لوحده مش بيحرك حاجة، لازم تضيف top أو left."],
["الرقم الأكبر في z-index يبقى فوق.",true,"أيوه، الأكبر بيظهر فوق."],
["لو مفيش أب عليه position، الـ absolute بيتحرك بالنسبة للصفحة.",true,"أيوه، بيروح للصفحة كلها لما ملقاش أب عليه position."],
["العنصر ده هيتحرك 10px لتحت:\nposition: static;\ntop: 10px;",false,"top مبيشتغلش على static، فالعنصر هيفضل في مكانه."]];
const pv=k=>`<div class="hero">${k>=2?'<div class="logo">LOGO</div>':''}${k>=3?'<button class="b">Search</button>':''}${k>=4?'<div class="bx"></div>':''}</div>`;
const C=(t,tag,h,pre,k)=>()=>`<div class="tag">${tag}</div><h2>${h}</h2>${k?pv(k):''}${t?`<p>${t}</p>`:''}${pre?`<pre>${E(pre)}</pre>`:''}<button class="btn" onclick="go(1)" ${0?'':''}>التالي</button>`;
const rnd=a=>a.map((_,j)=>j).sort(()=>Math.random()-.5);
const L=['a','b','c','d'];
const S=[()=>`<div class="tag">CSS Position</div><h1>اختبار Position 📍</h1><p>15 سؤال: 10 اختيارات + 5 صح وغلط + تحدي في الآخر<br>المواضيع: relative ، absolute ، z-index</p><button class="btn" onclick="go(1)">يلا نبدأ</button>`];
mc.forEach((q,n)=>{const k=rnd(q[1]);S.push(()=>`<div class="tag">اختيار من متعدد ${n+1}/${mc.length}</div>${Q(q[0])}`+k.map((j,x)=>{const o=E(q[1][j]),ar=/[\u0600-\u06FF]/.test(o);return `<button class="o" dir="${ar?'rtl':'ltr'}" onclick="pick(this,${j},${q[2]})">${L[x]}) ${o}</button>`}).join(""))});
tf.forEach((q,n)=>S.push(()=>`<div class="tag">صح ولا غلط ${n+1}/${tf.length}</div>${Q(q[0])}<button class="o" onclick="pick(this,1,${q[1]?1:0})">✅ صح</button><button class="o" onclick="pick(this,0,${q[1]?1:0})">❌ غلط</button>`));
const tot=mc.length+tf.length;
S.push(()=>`<div class="tag">النتيجة</div><div class="big">${sc} / ${tot}</div><h2>${sc/tot>=.8?"جامد جداً! 🔥":sc/tot>=.5?"كويس، كمّل 👍":"ولا يهمك، راجع وجرّب تاني 💪"}</h2><button class="btn" onclick="go(1)">التحدي الأخير 🚀</button>`);
S.push(()=>`<div class="tag">🚀 التحدي</div><h2>اعمل صفحة زي Wego</h2><p>دي النتيجة النهائية اللي عايزينها:</p>${pv(4)}<p>المطلوب (4 حاجات بس):<br>1) خلفية كبيرة (صورة زي Wego أو لون متدرج)<br>2) اللوجو فوق على اليمين<br>3) زرار في نص الصفحة<br>4) صندوق أبيض تحت الزرار بشوية<br>هنستخدم: relative و absolute بس.</p><button class="btn" onclick="go(1)">ورّيني الحل خطوة خطوة</button>`);
S.push(C("اكتب الـ HTML ده. عندنا أب واحد (hero) وجواه 3 حاجات.","خطوة 1/5","الـ HTML",`<div class="hero">
  <div class="logo">LOGO</div>
  <button class="btn">Search</button>
  <div class="box"></div>
</div>`,0));
S.push(C("نخلي الأب relative عشان يبقى هو المرجع، ونحط الخلفية. (حط الصورة باسم hero.jpg جنب الملف)","خطوة 2/5","الخلفية والأب",`body { margin: 0; }
.hero {
  position: relative;
  height: 100vh;
  background: url("hero.jpg") center / cover;
}`,1));
S.push(C("اللوجو absolute، ونحدد بعده من فوق ومن اليمين.","خطوة 3/5","اللوجو فوق على اليمين",`.logo {
  position: absolute;
  top: 20px;
  right: 20px;
  color: white;
  font-size: 28px;
}`,2));
S.push(C("نزق الزرار 50% من فوق و50% من الشمال، وtranslate بيرجّعه نص حجمه لورا عشان يبقى في النص بالظبط.","خطوة 4/5","الزرار في النص",`.btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 12px 30px;
}`,3));
S.push(C("الصندوق نفس فكرة الزرار بس top أكبر شوية (60%) عشان ينزل تحته.","خطوة 5/5","الصندوق الأبيض تحت الزرار",`.box {
  position: absolute;
  top: 60%;
  left: 50%;
  transform: translateX(-50%);
  width: 300px;
  height: 120px;
  background: white;
}`,4));
S.push(()=>`<div class="tag">خلصنا 🎉</div><h2>برافو! النتيجة النهائية</h2>${pv(4)}<p>الفكرة كلها: الأب relative، والأولاد absolute وتتحركوا بـ top و left و right.</p><button class="btn" onclick="sc=0;done={};go(-i)">ابدأ من الأول</button>`);
let i=0,sc=0,done={};
function pick(b,j,c){if(done[i])return;done[i]=1;const p=b.parentNode,bs=[...p.querySelectorAll('.o')],ok=j==c;if(ok){sc++;b.classList.add('ok')}else{b.classList.add('no');const t=bs.find(x=>x.getAttribute('onclick').startsWith(`pick(this,${c},`));t&&t.classList.add('ok')}
const ex=i<=mc.length?mc[i-1][3]:tf[i-mc.length-1][2];const d=document.createElement('div');d.className='fb '+(ok?'g':'r');d.textContent=(ok?'✅ صح! ':'❌ غلط. ')+ex;p.appendChild(d)}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));r()}
function r(){sl.innerHTML=S[i]();pb.style.width=(i/(S.length-1)*100)+'%';pv_.disabled=i==0;nx.disabled=i==S.length-1}
nx.onclick=()=>go(1);pv_.onclick=()=>go(-1);
addEventListener('keydown',e=>{if(e.key=='ArrowLeft')go(1);if(e.key=='ArrowRight')go(-1)});
r();
</script>
</body>
</html>
