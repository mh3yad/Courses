<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logarithm – JavaScript Basics Lesson</title>
<style>
:root{--bg:#0f1a2e;--card:#172640;--ac:#5ac8e0;--tx:#fff;--mu:#aebcd2;--ok:#4cbf86;--no:#e5687a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 600px at 20% -10%,#26406b,var(--bg) 70%) fixed,var(--bg);color:var(--tx);font-family:"Cairo","Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
header{display:flex;align-items:center;gap:10px;padding:12px 18px}
header b{font-size:20px;letter-spacing:1px}header b span{color:var(--ac)}
header .logo{width:46px;height:46px;mix-blend-mode:lighten;border-radius:10px}
.who{margin-inline-start:auto;display:inline-flex;align-items:center;gap:6px;max-width:58vw;padding:5px 16px;border-radius:999px;background:linear-gradient(135deg,rgba(255,214,102,.16),rgba(255,140,200,.12));border:1.5px solid rgba(255,214,102,.55);box-shadow:0 0 16px rgba(255,200,90,.35),inset 0 0 10px rgba(255,255,255,.08)}
.who .nmt{font-weight:900;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(100deg,#ffd86b 0%,#fff7d1 22%,#ffb347 45%,#ff9ed2 60%,#fff7d1 78%,#ffd86b 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 2.6s linear infinite;filter:drop-shadow(0 0 6px rgba(255,200,90,.7))}
.who .sp{font-size:16px;animation:twinkle 1.4s ease-in-out infinite}.who .s2{animation-delay:.7s}
@keyframes shine{to{background-position:-260% 0}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.8) rotate(0)}50%{opacity:1;transform:scale(1.25) rotate(20deg)}}
.who.big2{display:flex;justify-content:center;margin:8px auto;max-width:92%;padding:10px 22px}.who.big2 .nmt{font-size:40px}.who.big2 .sp{font-size:28px}
.bar{height:6px;background:#2a3f63}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5ac8e0,#ffd86b,#ff9ed2);transition:.4s}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:14px}
.s{width:100%;max-width:780px;background:var(--card);border-radius:24px;padding:22px;border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tag{display:inline-block;background:rgba(90,200,224,.16);color:var(--ac);font-weight:800;font-size:14px;padding:3px 12px;border-radius:999px}
h1{font-size:32px;margin:10px 0}h2{font-size:26px;margin:8px 0 10px;line-height:1.5}
p{color:var(--mu);font-size:19px;line-height:1.8;margin:6px 0}p b{color:#fff}
.say{display:flex;align-items:center;gap:12px;margin:8px 0 12px}
.mas{font-size:46px;animation:bob 1.6s ease-in-out infinite;flex:none}
.bub{background:#22365a;border:1px solid rgba(255,255,255,.1);border-radius:18px 18px 18px 4px;padding:10px 16px;font-size:18px;line-height:1.7;color:#eaf2ff}
@keyframes bob{50%{transform:translateY(-7px) rotate(-6deg)}}
pre{direction:ltr;text-align:left;background:#101c32;padding:12px 14px;border-radius:14px;font-size:17px;line-height:1.7;color:#c6e5ef;margin:10px 0;overflow-x:auto}
pre .hl{background:rgba(255,216,107,.22);color:#ffe9a8;border-radius:5px;padding:0 4px}
pre .act{background:rgba(76,191,134,.22);display:block;border-radius:6px}
.btn{background:linear-gradient(135deg,#34aed2,#2271b5);color:#fff;border:0;padding:11px 22px;font:inherit;font-size:18px;font-weight:700;border-radius:14px;cursor:pointer;box-shadow:0 6px 16px rgba(34,113,181,.42),inset 0 1px 0 rgba(255,255,255,.4);text-shadow:0 1px 2px rgba(10,60,120,.45);transition:transform .12s,filter .12s;margin:4px 3px}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.06)}
.btn.pk{background:linear-gradient(135deg,#f58bb0,#d04a86);box-shadow:0 6px 16px rgba(208,74,134,.4),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.gd{background:linear-gradient(135deg,#f3a93c,#dd6f1f);box-shadow:0 6px 16px rgba(221,111,31,.4),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.on{outline:3px solid #fff;outline-offset:2px}
.btn:disabled{opacity:.35;cursor:default}
footer{display:flex;justify-content:space-between;padding:12px 18px}
.nm{width:100%;max-width:360px;font:inherit;font-size:22px;padding:12px 16px;border-radius:16px;border:2px solid #ffd86b;background:#1c3358;color:#fff;margin:10px 0;text-align:center;outline:none;display:block}.nm::placeholder{color:#8fa2c2}
.shake{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.track{position:relative;height:54px;background:linear-gradient(90deg,#1d3560,#274778);border-radius:14px;overflow:hidden;margin:8px 0;direction:ltr}
.rk{position:absolute;left:0;top:7px;font-size:32px;line-height:1}
@keyframes fly{from{left:0}to{left:calc(100% - 44px)}}
.ctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0}
input[type=range]{direction:ltr;flex:1;min-width:160px;accent-color:#ffd86b;height:28px}
.val{background:#22365a;border-radius:12px;padding:4px 14px;font-weight:900;font-size:22px;color:#ffd86b;direction:ltr}
.race{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;align-items:center;direction:ltr;margin:8px 0}
.race .lb{font-weight:800;font-size:15px;font-family:Consolas,monospace;color:#c6e5ef}
.race .track{margin:0;height:46px}.race .rk{top:5px;font-size:28px}
.say2{font-size:16px;color:var(--mu);margin:2px 0}
.mockwrap{display:flex;justify-content:center;background:#101c32;border-radius:16px;padding:14px;overflow:hidden}
.mock{border:3px solid #7e92b8;border-radius:14px;padding:10px;background:#1b2c4d;transition:none;direction:ltr}
.mbox{border-radius:10px;padding:18px 8px;text-align:center;font-weight:900;font-size:20px;background:#3ba06c;color:#fff}
.mock.w .mbox{background:#7b6bdc}
.mcards{display:grid;grid-template-columns:1fr;gap:8px}.mock.w .mcards{grid-template-columns:repeat(3,1fr)}
.mcards div{background:linear-gradient(135deg,#5ac8e0,#4a80d8);border-radius:10px;padding:14px 0;text-align:center;font-size:26px}
.opt{display:block;width:100%;text-align:start;margin:8px 0;padding:13px 16px;font:inherit;font-size:19px;font-weight:700;color:#fff;background:#22365a;border:2px solid #34507e;border-radius:14px;cursor:pointer}
.opt:hover{border-color:var(--ac)}.opt.ok{background:var(--ok);border-color:var(--ok)}.opt.no{background:var(--no);border-color:var(--no)}
.fall{position:fixed;top:-30px;font-size:26px;pointer-events:none;animation:fall 2s linear forwards;z-index:50}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.big{font-size:56px;font-weight:900;color:#ffd86b}
@media(max-width:480px){.who .nmt{font-size:18px}.race{grid-template-columns:84px 1fr}h1{font-size:26px}}
.stage{display:flex;justify-content:center;align-items:center;background:#101c32;border-radius:16px;padding:18px;margin:8px 0;min-height:130px}
.pd{background:#7b6bdc;border:3px solid #ffd86b;border-radius:8px;display:inline-block;direction:ltr}
.ct{background:#3f7fd4;color:#fff;font-weight:800;padding:12px 18px;border-radius:5px}
.bs{width:104px;height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:4px;font-weight:800;text-align:center;color:#fff;line-height:1.5}
.bb{width:70%;max-width:260px;height:90px;display:flex;align-items:center;justify-content:center;font-weight:800;background:#22365a;color:#fff;font-size:20px}
img{vertical-align:middle}
.mgp{background:rgba(243,169,60,.32);border:2px dashed #f3a93c;border-radius:8px;display:inline-block;direction:ltr}
.mgc{background:#3f7fd4;color:#fff;font-weight:800;padding:12px 18px;border-radius:5px}
.mgw{width:100%;background:rgba(243,169,60,.2);border:2px dashed #f3a93c;border-radius:8px;padding:8px 0;direction:ltr}
.mgb{background:#3f7fd4;color:#fff;text-align:center;padding:14px 0;border-radius:6px;font-weight:800;box-sizing:border-box}
.lab{direction:ltr;text-align:left;width:100%}.lab *{margin:6px;padding:6px 12px;border:1px dashed #6a81ad;border-radius:8px;color:#e3ecfb;font-weight:700;font-size:16px;transition:.2s}
.lab h2{font-size:19px;margin:6px;line-height:1.4}
.lab .hit{outline:3px solid #ffd86b;background:rgba(255,216,107,.24);box-shadow:0 0 14px rgba(255,216,107,.5)}
.arena{background:#101c32;border-radius:16px;padding:14px;margin:10px 0;direction:ltr;overflow:hidden}
.arena .row{display:flex;align-items:center;gap:12px;margin:8px 0}.arena .lb{width:150px;font-size:15px;font-weight:800;color:#c6e5ef;direction:rtl;text-align:right}
.tbx{width:90px;padding:14px 0;border-radius:8px;background:#3f7fd4;color:#fff;font-weight:800;text-align:center}
.arena:hover .tbx,.arena.go .tbx{width:220px;background:#ec6a8d}
.pbx2{width:90px;height:90px;border-radius:6px;background:#3f7fd4;display:flex;align-items:center;justify-content:center;font-size:44px;margin:auto;opacity:1}
.pbx2.go{width:220px;background:#ec6a8d;border-radius:46px;opacity:.45}
.ride,.rc,.car6{display:inline-block;font-size:44px;line-height:1}
.ride{transition-property:transform}.ride.go{transform:translateX(220px)}
.lane{position:relative;height:56px;background:#1d3560;border-radius:12px;margin:8px 0;display:flex;align-items:center;padding:0 8px}
.rc{transition-property:transform}.arena.go .rc:not(.mail){transform:translateX(250px)}
.mail{transition:transform 1.5s}.arena:hover .mail,.arena.go .mail{transform:translateX(240px)}
.runner{font:inherit;font-weight:800;font-size:20px;padding:12px 22px;border:0;border-radius:14px;color:#fff;background:linear-gradient(135deg,#f3a93c,#dd6f1f);cursor:pointer;transition:transform .25s;box-shadow:0 6px 16px rgba(221,111,31,.4)}
.runner:hover{transform:translateX(150px)}
.ruler{position:relative;height:60px;background:#1d3560;border-radius:12px;display:flex;align-items:center;justify-content:center}
.car6{transition:none}
.cb{white-space:pre;display:block}.cl{display:block;white-space:pre;padding:0 6px;border-radius:5px}
.cl.on{background:rgba(76,191,134,.28)}.cl.off{opacity:.35}.cl.chk{background:rgba(255,216,107,.2)}
.cnd{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;direction:ltr}.cd{font-family:Consolas,monospace;font-weight:800;border-radius:10px;padding:4px 12px;font-size:16px}
.cd.t{background:rgba(76,191,134,.25);color:#b9f3d6}.cd.f{background:rgba(229,104,122,.25);color:#ffc9d1}
.outp{background:#0c172b;border:1px solid #2a3f63;border-radius:14px;padding:10px 14px;direction:ltr;text-align:left;font-family:Consolas,monospace;font-size:19px;color:#9af0c0;min-height:70px}
.outp .oh{color:#7d90b3;font-size:13px;margin-bottom:4px}.outp .none{color:#6a7c9c;font-style:italic}
.aw{display:flex;justify-content:center;gap:8px;margin:12px 0;flex-wrap:wrap}
.ac{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}.ac small{font-size:15px;font-weight:800;color:#8fd0e6;background:#22365a;border-radius:8px;padding:0 10px}
.av{min-width:64px;height:64px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:linear-gradient(135deg,#5ac8e0,#4a80d8);font-size:24px;font-weight:900;color:#fff;border:3px solid transparent;transition:.25s;text-shadow:0 1px 2px rgba(20,50,130,.4)}
.ac.hl .av{border-color:#ffd86b;transform:scale(1.12);background:linear-gradient(135deg,#f3a93c,#dd6f1f);box-shadow:0 0 18px rgba(255,216,107,.5)}
.ai{width:78px;font:inherit;font-size:22px;font-weight:800;text-align:center;padding:8px;border-radius:12px;border:2px solid #5ac8e0;background:#1c3358;color:#fff;outline:none}
#fc .act{background:rgba(255,216,107,.3);border-radius:5px;color:#ffe9a8}#fc .cl.act{background:rgba(76,191,134,.3)}
.info{background:#22365a;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 16px;margin:10px 0;font-size:19px;line-height:1.8;color:#eaf2ff}
.wal{display:flex;align-items:center;justify-content:center;gap:14px;background:linear-gradient(135deg,#3ba06c,#278f68);border-radius:18px;padding:14px;margin:10px 0;font-size:24px;font-weight:800}
.wal b{font-size:48px;background:#0f3a2a55;border-radius:14px;padding:0 22px;direction:ltr}.bump{animation:bmp .45s}@keyframes bmp{40%{transform:scale(1.3);color:#ffd86b}}
.dlg{background:#e9eef7;color:#1f2a44;border-radius:14px;padding:14px 18px;margin:8px 0;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.dlg .dh{font-weight:800;color:#44557a;margin-bottom:8px}.dlg label{display:block;font-weight:800;margin:8px 0 4px}
.dlg input{width:100%;font:inherit;font-size:20px;padding:8px 12px;border-radius:10px;border:2px solid #9bb0d4;outline:none;direction:ltr;text-align:left}
.tbl{display:flex;flex-direction:column;gap:6px;margin:8px 0}.tr{display:flex;align-items:center;gap:12px;background:#101c32;border-radius:12px;padding:8px 14px;direction:ltr;font-size:19px}
.tr code{flex:1;color:#c6e5ef}.tr span{color:#7d90b3}.tr b{min-width:90px;text-align:right;color:#9af0c0;font-family:Consolas,monospace}.tr b.bad{color:#ffb4bd}
.out5{background:#101c32;border-radius:14px;padding:14px 16px;margin:8px 0;font-size:20px;line-height:1.9;direction:ltr;text-align:left;min-height:60px;font-family:Consolas,monospace}
.bad{color:#ffb4bd}.good{color:#9af0c0}
</style>
</head>

function confetti(){
  const em=['⭐','✨','🎉','🌟','💫'];
  for(let k=0;k<26;k++){const s=document.createElement('span');s.className='fall';s.textContent=em[k%em.length];s.style.left=Math.random()*100+'vw';s.style.animationDelay=(Math.random()*.6)+'s';s.style.fontSize=(18+Math.random()*20)+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),3000)}
}
function play(id,dur,delay,count,timing){
  const e=$(id);if(!e)return;e.style.animation='none';void e.offsetWidth;
  e.style.animation=`fly ${dur}s ${timing||'ease'} ${delay}s ${count}`;
}

const rj=src=>{const out=[];try{new Function('log',src)(x=>out.push(typeof x=='string'?JSON.stringify(x):String(x)))}catch(e){out.push('❌ '+e.name+': '+e.message)}return out};
const S=[];
S.push({h:()=>`<div style="text-align:center"><div style="font-size:74px;animation:bob 1.6s ease-in-out infinite">🧑‍💻</div><h1>أساسيات JavaScript بأمثلة من الحياة</h1><p>5 مواضيع، ولكل موضوع مثال من الواقع وتجربة بإيدك! 🎮<br><b>Variables</b> ، <b>Operators</b> ، <b>User input</b> ، <b>Type conversion</b> ، <b>Constants</b></p><p style="color:#ffd86b;font-weight:800;font-size:22px">اسمك إيه يا بطل؟ 🌟</p><input id="nm" class="nm" placeholder="اكتب اسمك هنا ✍️" maxlength="40" autocomplete="off" style="margin-inline:auto" oninput="NAME=this.value.trim()"><button class="btn gd" onclick="begin()">يلا نبدأ ▶</button></div>`});
/* 1 variables */
let money=100,LOGM=[];
S.push({h:()=>head('1/5','Variables: المتغيرات 💰')+say('👛','المتغير زي صندوق عليه اسم وبنحط جواه قيمة. مثال من الحياة: مصروف الجيب! دوس على الأزرار وشوف الكود.')+`<div class="wal"><span>👛 money</span><b id="mny">100</b></div><div class="ctl" style="justify-content:center"><button class="btn gd" onclick="mv(-20,'money = money - 20;   // bought a sandwich 🥪')">🥪 اشتري ساندويتش (−20)</button><button class="btn" onclick="mv(50,'money = money + 50;   // got a gift 🎁')">🎁 قبضت عيدية (+50)</button><button class="btn pk" onclick="mv(0)">🔄 من الأول</button></div><pre id="c1"></pre><div class="info">📦 في المتغيرات تقدر تحط أنواع قيم مختلفة:<pre style="margin:6px 0 0">let userName = "Sara";   // text\nlet age = 12;            // number\nlet isStudent = true;    // true / false</pre></div>`,i:()=>{money=100;LOGM=[];mv(null)}});
function mv(d,line){if(d===0){money=100;LOGM=[]}else if(d){if(money+d<0){return}money+=d;LOGM.push(line)}
  setTxt('mny',money);const e=$('mny');e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump');setCode('c1','let money = 100;   // pocket money\n'+LOGM.join('\n'))}
/* 2 operators */
let op='+',oa=5,ob=3;
const ST={'+':(a,b)=>`معايا ${a} جنيه ومعايا ${b} كمان. كام معايا؟`,'-':(a,b)=>`معايا ${a} جنيه واشتريت حاجة بـ ${b}. فضل كام؟`,'*':(a,b)=>`${a} علب، كل علبة بـ ${b} جنيه. الحساب كام؟`,'/':(a,b)=>`${a} قطع بيتزا 🍕 على ${b} أصحاب. كل واحد ياخد كام؟`,'%':(a,b)=>`${a} بسكوتة على ${b} أصحاب. هيفضل كام ما اتقسمش؟`,'**':(a,b)=>`${a} مضروبة في نفسها ${b} مرات (زي مساحة المربع لو ${b} = 2).`};
const OPN={'+':'جمع','-':'طرح','*':'ضرب','/':'قسمة','%':'الباقي','**':'أُس'};
S.push({h:()=>head('2/5','Arithmetic operators: العمليات الحسابية 🧮')+say('🛒','زي الكاشير بالظبط! اختار العملية، وحرّك الأرقام، وشوف القصة والنتيجة.')+`<div class="ctl" style="justify-content:center">${Object.keys(ST).map(k=>`<button class="btn" id="op_${k.replace('*','x').replace('/','d').replace('%','m').replace('+','p').replace('-','s')}" data-o="${k}" onclick="selOp(this.dataset.o)">${k} <small>${OPN[k]}</small></button>`).join('')}</div><div class="ctl"><span class="say2" style="min-width:30px">a</span><input type="range" id="oa" min="1" max="20" value="5"><span class="val" id="va">5</span></div><div class="ctl"><span class="say2" style="min-width:30px">b</span><input type="range" id="ob" min="1" max="10" value="3"><span class="val" id="vb">3</span></div><div class="info" id="ost"></div><pre id="oc"></pre><div class="info">⚠️ الترتيب زي الفاتورة: الضرب والقسمة الأول!<pre style="margin:6px 0 0" id="ocp"></pre></div>`,i:()=>{$('oa').oninput=uo;$('ob').oninput=uo;selOp('+')}});
function selOp(o){op=o;document.querySelectorAll('[data-o]').forEach(b=>b.classList.toggle('on',b.dataset.o==o));uo()}
function calc(a,b,o){return o=='+'?a+b:o=='-'?a-b:o=='*'?a*b:o=='/'?a/b:o=='%'?a%b:a**b}
function uo(){oa=+$('oa').value;ob=+$('ob').value;$('va').textContent=oa;$('vb').textContent=ob;let r=calc(oa,ob,op);if(!Number.isInteger(r))r=Math.round(r*100)/100;
  setTxt('ost','🧾 '+ST[op](oa,ob)+'<br>الجواب: <span class="val">'+r+'</span>');setCode('oc',`console.log(${oa} ${op} ${ob});   // ${r}`);setCode('ocp',`console.log(2 + 3 * 4);   // ${2+3*4}  (مش 20)\nconsole.log((2 + 3) * 4); // ${(2+3)*4}  (الأقواس الأول)`)}
/* 3 input */
S.push({h:()=>head('3/5','User input: المستخدم يدخّل بيانات ⌨️')+say('🏨','زي موظف الاستقبال في الفندق: بيسأل اسمك وعمرك. في JavaScript بنستخدم prompt()، والإجابة بتيجي دايماً كنص!')+`<div class="dlg"><div class="dh">🌐 الموقع بيسأل:</div><label>اسمك إيه؟</label><input id="pn" placeholder="Ali" autocomplete="off"><label>عمرك كام؟</label><input id="pa" placeholder="12" autocomplete="off"></div><pre id="c3"></pre><div class="info" id="i3"></div>`,i:()=>{$('pn').oninput=u3;$('pa').oninput=u3;u3()}});
function u3(){const n=$('pn').value,a=$('pa').value;
  setCode('c3',`let name = prompt("What is your name?");\nlet age = prompt("How old are you?");\n\nconsole.log(name);        // ${JSON.stringify(n)}\nconsole.log(typeof name); // "string"\nconsole.log(age);         // ${JSON.stringify(a)}\nconsole.log(typeof age);  // "string"  ← حتى لو كتبت رقم!`);
  setTxt('i3',n?`👋 أهلاً <b>${E(n)}</b>!`+(a?` عمرك <b>${E(a)}</b>، بس ده جه كـ <b>نص</b> مش رقم 😮`:''):'اكتب اسمك وعمرك فوق 👆')}
/* 4 type conversion */
S.push({h:()=>head('4/5','Type conversion: تحويل الأنواع 🔁')+say('🧾','الكاشير استلم السعر مكتوب كنص "5". لو جمعه على 3 هيطلع "53" 😂! لازم نحوّله لرقم الأول. اكتب قيمة وشوف.')+`<div class="ctl" dir="ltr" style="justify-content:center"><span class="say2">x =</span><input class="ai" id="tx" value="5" style="width:130px;text-align:left"><span class="say2">y = 3</span></div><div class="tbl" id="tcv"></div>`,i:()=>{$('tx').oninput=u4;u4()}});
function u4(){const x=$('tx').value,j=JSON.stringify(x);const rows=[[`x + 3`,`${j} + 3`],[`Number(x) + 3`,`Number(${j}) + 3`],[`parseInt(x)`,`parseInt(${j})`],[`Number(x)`,`Number(${j})`],[`typeof x`,`typeof ${j}`],[`String(3) + "جنيه"`,`String(3) + "جنيه"`]];
  setTxt('tcv',rows.map(r=>{const o=rj(`log(${r[1]})`)[0];return `<div class="tr"><code>${E(r[0])}</code><span>→</span><b class="${o.includes('NaN')?'bad':''}">${E(o)}</b></div>`}).join('')+'<div class="info" style="margin-top:8px">💡 جرّب: <b>5</b> ثم <b>12px</b> ثم <b>hello</b>. لما التحويل مش ممكن بيطلع <b>NaN</b> (Not a Number).</div>')}
/* 5 constants */
S.push({h:()=>head('5/5','Constants: الثوابت 🪪')+say('🔒','const زي رقم البطاقة: بيتحط مرة واحدة ومينفعش يتغير! لو حاولت تغيّره JavaScript يزعق. جرّب!')+`<pre>const birthYear = 2012;   // مينفعش يتغير\nlet age = 12;              // ممكن يتغير</pre><div class="ctl" style="justify-content:center"><button class="btn pk" onclick="tryC()">😈 غيّر الـ const</button><button class="btn" onclick="tryL()">✅ غيّر الـ let</button></div><div class="out5" id="o5">دوس على زرار 👆</div><div class="info">🧾 مثال حقيقي: ضريبة ثابتة<pre style="margin:6px 0 0">const VAT = 0.14;   // 14% دايماً</pre><div class="ctl" dir="ltr"><span class="say2">price =</span><input class="ai" id="pr" type="number" value="100" style="width:110px"></div><div id="vat" class="val" style="direction:ltr;margin-top:6px"></div></div>`,i:()=>{$('pr').oninput=uv;uv()}});
function tryC(){const o=rj('const birthYear = 2012;\nbirthYear = 2013;\nlog(birthYear);');setTxt('o5','<span class="bad">'+E(o[0])+'</span><br><small>const مينفعش يتغير ✋</small>')}
function tryL(){const o=rj('let age = 12;\nage = 13;\nlog(age);');setTxt('o5','<span class="good">age = '+E(o[0])+' ✅</span><br><small>let بيتغير عادي</small>')}
function uv(){const p=+$('pr').value||0;const t=Math.round(p*(1+0.14)*100)/100;setTxt('vat',`price + price * VAT = ${t}`)}
/* quick check */
const QZ=[
["let money = 100; money = money - 20; إيه قيمة money؟",["80","100","120"],0,"100 ناقص 20 = 80 💰"],
["prompt() بيرجّع الإجابة كـ؟",["نص (string)","رقم","true/false"],0,"prompt دايماً بيرجّع نص، حتى لو كتبت رقم ⌨️"],
['"5" + 3 بيطلع؟',['"53"',"8","error"],0,'لو واحد نص، الـ + بتلزّق: "53". حوّل لرقم بـ Number() 🔁'],
["لو غيّرنا قيمة const بيحصل إيه؟",["بيطلع error","بيتغير عادي","مفيش حاجة"],0,"const مينفعش يتغير: TypeError 🔒"]];
let qi=0,qdone=false;
S.push({h:()=>head('تحدّي سريع','اختبر نفسك يا بطل! 🎯')+say('🤖','4 أسئلة بس، ومن غير مؤقت. خد وقتك!')+`<div id="qz"></div>`,i:()=>{qi=0;stars=0;showQ()}});
S.push({h:()=>`<div style="text-align:center"><div style="font-size:70px">🏆</div><h1>برافو يا بطل!</h1><div class="who big2"><span class="sp">✨</span><span class="nmt">${E(NAME)}</span><span class="sp s2">✨</span></div><div class="big">${'⭐'.repeat(stars)||'💪'}</div><p>جمعت <b>${stars}</b> من 4 نجوم</p><p>دلوقتي بتعرف أساسيات JavaScript! 🎉</p><button class="btn gd" onclick="i=1;r()">🔁 نراجع تاني</button><button class="btn" onclick="i=0;r()">🏠 من الأول</button></div>`,i:()=>confetti()});
function showQ(){
  const q=QZ[qi];qdone=false;
  $('qz').innerHTML=`<p><b>سؤال ${qi+1}/4</b> · ⭐ ${stars}</p><h2 dir="rtl">${E(q[0])}</h2>`+q[1].map((o,j)=>`<button class="opt" dir="ltr" style="text-align:center" onclick="ans(this,${j})">${E(o)}</button>`).join('')+`<div id="qf"></div>`;
}
function ans(b,j){
  if(qdone)return;qdone=true;const q=QZ[qi],ok=j==q[2],bs2=[...document.querySelectorAll('.opt')];
  if(ok){b.classList.add('ok');stars++;confetti()}else{b.classList.add('no');bs2[q[2]].classList.add('ok')}
  $('qf').innerHTML=`<p style="color:#fff;font-size:20px">${ok?'🎉 شاطر يا '+E(NAME)+'!':'💪 مش مشكلة يا '+E(NAME)+'!'} ${E(q[3])}</p><button class="btn gd" onclick="nextQ()">${qi==3?'شوف نتيجتك 🏆':'السؤال اللي بعده ←'}</button>`;
}
function nextQ(){if(qi<3){qi++;showQ()}else{i++;r()}}
/* ---------- engine ---------- */
function begin(){
  if(!NAME){const el=$('nm');el.classList.add('shake');el.focus();setTimeout(()=>el.classList.remove('shake'),450);return}
  $('who').innerHTML='<span class="sp">✨</span><span class="nmt">'+E(NAME)+'</span><span class="sp s2">✨</span>';$('who').style.display='inline-flex';go(1);
}
function r(){
  $('sl').innerHTML=S[i].h();
  const n=$('nm');if(n)n.value=NAME;
  $('pb').style.width=(i/(S.length-1)*100)+'%';
  $('pv').disabled=i==0;$('nx').disabled=(i==S.length-1)||(i==0)||(i==S.length-2&&qi<3&&!qdone&&false);
  $('nx').style.visibility=i==0?'hidden':'visible';
  if(S[i].i)S[i].i();window.scrollTo(0,0);
}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));r()}
$('nx').onclick=()=>go(1);$('pv').onclick=()=>go(-1);
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;if(e.key=='ArrowLeft')go(1);if(e.key=='ArrowRight')go(-1)});
r();
</script>
