<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدرس: CSS Selectors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#0d1117;
  --bg2:#161b27;
  --card:#1c2333;
  --text:#e6edf3;
  --text-muted:#9aa7b8;
  --text-dim:#6e7a8a;
  --accent-blue:#2f81f7;
  --accent-teal:#39c5cf;
  --accent-green:#3fb950;
  --accent-orange:#d29922;
  --accent-red:#f85149;
  --accent-purple:#bc8cff;
  --code-bg:#0b0f16;
  --ln:#4b5263;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Cairo',sans-serif;
  font-weight:700;
  overflow:hidden;
  direction:rtl;
}
.deck{position:fixed;inset:0;}
.slide{
  position:absolute;inset:0;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  text-align:center;
  min-height:100vh;
  padding:clamp(54px,7vh,96px) clamp(20px,3vw,64px) clamp(76px,10vh,128px);
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior-y:contain;
}
.slide.active{display:flex;}
h1{font-size:clamp(48px,6.4vw,104px);line-height:1.28;font-weight:900;}
h2{font-size:clamp(36px,4.35vw,72px);line-height:1.32;font-weight:900;margin-bottom:14px;}
.slide-tag{
  color:var(--accent-teal);
  letter-spacing:1px;
  font-size:clamp(28px,2vw,36px);
  margin-bottom:18px;
  border:1px solid rgba(57,197,207,.35);
  padding:6px 22px;border-radius:999px;
  background:rgba(57,197,207,.08);
}
.subtitle{color:var(--text-muted);font-size:clamp(28px,2.4vw,42px);max-width:none;width:100%;line-height:1.8;}
.mt-16{margin-top:22px;} .mt-24{margin-top:30px;}
/* highlights */
.highlight-blue{color:var(--accent-blue);}
.highlight-teal{color:var(--accent-teal);}
.highlight-green{color:var(--accent-green);}
.highlight-orange{color:var(--accent-orange);}
.highlight-red{color:var(--accent-red);}
.highlight-purple{color:var(--accent-purple);}
.gradient-text{background:linear-gradient(90deg,var(--accent-blue),var(--accent-purple));-webkit-background-clip:text;background-clip:text;color:transparent;}
.rainbow-text{background:linear-gradient(90deg,#2f81f7,#39c5cf,#3fb950,#d29922,#f85149,#bc8cff);-webkit-background-clip:text;background-clip:text;color:transparent;}
.rainbow-line{height:4px;width:180px;border-radius:2px;margin:22px auto 0;background:linear-gradient(90deg,#2f81f7,#39c5cf,#3fb950,#d29922,#f85149,#bc8cff);}
/* glow blobs */
.glow-blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.28;pointer-events:none;z-index:0;}
.glow-blue{background:var(--accent-blue);width:420px;height:420px;}
.glow-teal{background:var(--accent-teal);width:420px;height:420px;}
.glow-purple{background:var(--accent-purple);width:420px;height:420px;}
.glow-green{background:var(--accent-green);width:420px;height:420px;}
.slide>*{position:relative;z-index:1;}
/* code window (VSCode One Dark Pro) */
.code-window{
  direction:ltr;text-align:left;
  background:var(--code-bg);
  border:1px solid #30363d;
  border-radius:12px;
  max-width:none!important;width:100%;
  margin:24px auto 0;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
  font-family:'Cascadia Code','Fira Code',Consolas,monospace;
}
.code-titlebar{
  display:flex;align-items:center;gap:8px;
  background:#161b22;padding:13px 18px;
  border-bottom:1px solid #21262d;
}
.code-dot{width:14px;height:14px;border-radius:50%;}
.code-dot.red{background:#ff5f57;} .code-dot.yellow{background:#febc2e;} .code-dot.green{background:#28c840;}
.code-filename{color:var(--text-dim);font-size:28px;margin-left:12px;font-family:'Cairo',sans-serif;font-weight:700;}
.code-body{
  padding:28px 32px;
  font-size:clamp(28px,2.5vw,44px);
  line-height:1.7;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;
  overflow-x:hidden;
}
.ln{color:var(--ln);user-select:none;margin-right:22px;}
/* syntax colors - One Dark Pro (VSCode) */
.tag{color:#e06c75;} .attr{color:#d19a66;} .str{color:#98c379;}
.kw{color:#c678dd;} .fn{color:#61afef;} .prop{color:#e5c07b;}
.punc{color:#56b6c2;} .comment{color:#5c6370;font-style:italic;} .num{color:#d19a66;}
/* generic card */
.card{
  background:var(--card);border:1px solid #2b3446;border-radius:16px;
  padding:34px 42px;max-width:none;width:100%;
}
/* topics list */
.topics-list{
  display:flex;flex-direction:column;gap:16px;margin-top:30px;width:100%;
}
.topic-item{
  display:flex;align-items:center;gap:14px;
  background:var(--card);border:1px solid #2b3446;border-radius:14px;
  padding:20px 32px;font-size:clamp(28px,2.5vw,42px);
  transition:transform .2s,border-color .2s;
}
.topic-item:hover{transform:translateX(-6px);border-color:var(--accent-teal);}
.topic-num{
  min-width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:28px;color:#0d1117;background:var(--accent-teal);
}
/* vs cards */
.vs-container{display:flex;align-items:center;gap:34px;margin-top:34px;flex-wrap:wrap;justify-content:center;width:100%;}
.vs-card{background:var(--card);border:1px solid #2b3446;border-radius:18px;padding:34px 38px;flex:1 1 40%;width:auto;}
.vs-name{font-size:clamp(30px,3vw,46px);font-weight:900;margin:6px 0;}
.vs-desc{color:var(--text-muted);font-size:clamp(28px,2.1vw,36px);line-height:1.8;}
.vs-plus{font-size:58px;font-weight:900;color:var(--accent-teal);animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.25);opacity:.6;}}
/* flip cards */
.flip-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:32px;justify-content:center;width:100%;}
.flip-card{position:relative;width:100%;height:280px;perspective:1000px;cursor:pointer;}
.flip-front,.flip-back{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;
  transition:transform .6s;
}
.flip-front{background:var(--card);border:2px solid var(--accent-teal);}
.flip-back{background:var(--bg2);border:2px solid var(--accent-purple);transform:rotateY(180deg);}
.flip-card.flipped .flip-front{transform:rotateY(180deg);}
.flip-card.flipped .flip-back{transform:rotateY(360deg);}
.flip-title{font-size:clamp(28px,2.4vw,42px);font-weight:900;}
.flip-subtitle{color:var(--text-muted);font-size:28px;line-height:1.8;}
.flip-hint{font-size:28px;color:var(--text-dim);margin-top:8px;}
.flip-detail{font-size:clamp(28px,2.2vw,38px);color:var(--text-muted);line-height:1.9;text-align:center;}
/* clock diagram */
.clock-wrap{margin-top:20px;direction:ltr;}
.hstack{display:flex;align-items:center;justify-content:center;gap:clamp(30px,5vw,90px);margin-top:28px;flex-wrap:wrap;direction:ltr;width:100%;}
.clock{width:min(440px,60vw);height:min(440px,60vw);}
/* stats / revision */
.stats-row{display:flex;gap:28px;margin-top:34px;flex-wrap:wrap;justify-content:center;width:100%;}
.stat-card{background:var(--card);border:1px solid #2b3446;border-radius:16px;padding:30px 42px;min-width:300px;flex:1 1 40%;}
.stat-number{font-size:clamp(32px,3.3vw,52px);font-weight:900;}
.stat-label{font-size:28px;margin-top:8px;}
.stat-desc{color:var(--text-muted);font-size:28px;margin-top:6px;line-height:1.8;}
/* chrome */
.branding{position:fixed;top:20px;right:26px;z-index:50;display:flex;align-items:center;gap:12px;color:var(--text-muted);font-size:18px;}
.branding-icon{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--accent-blue),var(--accent-teal));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;}
.slide-nav{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:50;}
.nav-dot{width:10px;height:10px;border-radius:50%;background:#30363d;cursor:pointer;transition:.2s;}
.nav-dot.active{background:var(--accent-teal);transform:scale(1.35);}
.progress-bar{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--accent-blue),var(--accent-teal));z-index:60;transition:width .3s;}
.slide-counter{position:fixed;bottom:24px;right:26px;color:var(--text-dim);font-size:17px;z-index:50;}
.nav-hints{position:fixed;bottom:24px;left:26px;color:var(--text-dim);font-size:16px;z-index:50;}
kbd{background:#21262d;border:1px solid #30363d;border-radius:6px;padding:3px 9px;font-family:inherit;}
/* Enlarge the small inline teaching notes used on a few slides. */
.slide .subtitle[style*="font-size:14px"]{font-size:28px!important;}
.topic-item span[style*="font-size:14px"]{font-size:28px!important;}
.slide h2 span[style*="font-size:15px"]{font-size:28px!important;}
.card > p[style]{font-size:28px!important;}
.card > div[style]{font-size:28px!important;}
/* particles */
.particles{position:fixed;inset:0;z-index:0;pointer-events:none;}
.particle{position:absolute;border-radius:50%;background:var(--accent-teal);opacity:.15;animation:floatUp linear infinite;}
@keyframes floatUp{from{transform:translateY(110vh);}to{transform:translateY(-10vh);}}
/* animations */
.anim-1{animation:fadeInUp .5s .05s both;}
.anim-2{animation:fadeInUp .5s .18s both;}
.anim-3{animation:fadeInUp .5s .3s both;}
.anim-4{animation:fadeInUp .5s .45s both;}
.anim-5{animation:fadeInUp .5s .6s both;}
@keyframes fadeInUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
@media (max-width:640px){
  .slide{padding:58px 22px 84px;}
  .flip-grid{grid-template-columns:minmax(240px,90vw);}
  .vs-card{width:100%;}
}

.k{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:'Cascadia Code','Fira Code',Consolas,monospace;color:var(--accent-teal);background:rgba(57,197,207,.1);border-radius:8px;padding:0 10px}
.rw{margin-top:22px;text-align:right;font-size:clamp(26px,2vw,34px);line-height:1.9;border-color:rgba(57,197,207,.4)}
.pair{display:flex;gap:24px;flex-wrap:wrap;width:100%;direction:ltr}
.pair .code-window{flex:1 1 380px;min-width:0;margin-top:24px}
</style>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="branding"><div class="branding-icon">{ }</div> CSS Basics</div>
<div class="slide-nav" id="slideNav"></div>
<div class="progress-bar" id="progress"></div>
<div class="slide-counter" id="counter"></div>
<div class="nav-hints"><span><kbd>←</kbd> <kbd>→</kbd> للتنقل &nbsp; <kbd>F</kbd> ملء الشاشة</span></div>
<div class="deck" id="deck"></div>
<script>
const E=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const P=(c,s)=>`<span class="${c}">${E(s)}</span>`;
const K=s=>s.replace(/`([^`]+)`/g,(m,a)=>`<span class="k">${E(a)}</span>`);
function hl(l,lang){
  if(lang==='html')return l.replace(/(<\/?)([\w-]+)|([\w-]+)(=)("[^"]*")|(>)/g,(m,a,b,c,d,e,f)=>a?P('punc',a)+P('tag',b):c?P('attr',c)+P('punc',d)+P('str',e):P('punc',f));
  return l.replace(/([^{}\n;]+?)(\s*\{)|([\w-]+)(\s*:\s*)([^;\n{}]+)(;)|([{}])/g,(m,sel,br,p,col,v,sc,b)=>sel?P('tag',sel)+' '+P('punc','{'):p?P('fn',p)+P('punc',col)+P(/^\d/.test(v)?'num':'str',v)+P('punc',sc):P('punc',b));
}
const win=(name,code,lang)=>`<div class="code-window"><div class="code-titlebar"><div class="code-dot red"></div><div class="code-dot yellow"></div><div class="code-dot green"></div><span class="code-filename">${name}</span></div><div class="code-body">${code.split('\n').map((l,i)=>`<span class="ln">${i+1}</span>${hl(l,lang)}`).join('\n')}</div></div>`;
const T=[
{tag:'الجزء الأول',g:'teal',h:'الـ <span class="highlight-teal">Selector</span> ده إيه؟ 🎯',s:'الـ `selector` هو اللي بيقول للـ CSS: "نسّق مين؟" وبعدين بتكتب الشكل جوه `{ }`',rw:'زي ما تنادي في الفصل "يا أحمد!" — اللي نادّيت اسمه هو اللي يرد، والباقي مش هيتحرك.',html:'<h1>Hello</h1>\n<p>Hi</p>',css:'h1 {\n  color: red;\n}',res:'الـ `h1` بس هو اللي بقى أحمر، والـ `p` فضل زي ما هو'},
{tag:'الجزء التاني',g:'blue',h:'الـ <span class="highlight-blue">class</span> ( . )',s:'الـ `class` اسم بتحطه على أكتر من element، وبتختاره بنقطة `.` قبل الاسم',rw:'زي الجاكيت الأزرق بتاع المدرسة: كل الطلبة لابسينه، فبتقول "كل اللي لابس الجاكيت" وتنادي عليهم مرة واحدة.',html:'<p class="box">One</p>\n<p class="box">Two</p>\n<p>Three</p>',css:'.box {\n  color: blue;\n}',res:'`One` و `Two` بقوا أزرق، و `Three` لأ لأنه ملوش class'},
{tag:'الجزء التالت',g:'purple',h:'الـ <span class="highlight-orange">id</span> ( # )',s:'الـ `id` اسم بيتحط على element واحد بس، وبتختاره بـ `#` قبل الاسم',rw:'زي رقم البطاقة: كل شخص ليه رقم واحد بس، ومفيش اتنين ياخدوا نفس الرقم.',html:'<h1 id="title">Hi</h1>',css:'#title {\n  color: green;\n}',res:'الـ `id` ما يتكررش، واحد بس في الصفحة كلها'},
{tag:'الجزء الرابع',g:'purple',h:'الـ <span class="highlight-purple">Direct Child</span> ( &gt; )',s:'علامة `>` معناها: "الابن المباشر بس" مش الحفيد',rw:'زي العيلة: انت ابن أبوك مباشرة، لكن ابنك هو حفيد جدك مش ابنه المباشر.',html:'<div class="card">\n  <p>One</p>\n  <section>\n    <p>Two</p>\n  </section>\n</div>',css:'.card > p {\n  color: blue;\n}',res:'`One` بس اللي بقى أزرق، لأن `Two` جوه `section` يعني حفيد مش direct child'},
{tag:'الجزء الخامس',g:'green',h:'الـ <span class="highlight-green">first-child</span>',s:'الـ `:first-child` بيختار الـ element اللي هو أول ابن لأبوه',rw:'زي أول واحد واقف في طابور العيش: هو بس اللي بتناديه، مش اللي وراه.',html:'<ul>\n  <li>Apple</li>\n  <li>Banana</li>\n  <li>Cherry</li>\n</ul>',css:'li:first-child {\n  color: red;\n}',res:'`Apple` بس اللي بقى أحمر'},
{tag:'الجزء السادس',g:'blue',h:'الـ <span class="highlight-red">*</span> ( النجمة )',s:'الـ `*` بيختار كل الـ elements في الصفحة من غير استثناء',rw:'زي ما تدهن حيطان الأوضة كلها بنفس اللون من غير ما تختار حيطة حيطة.',html:'<h1>Hi</h1>\n<p>Hello</p>',css:'* {\n  margin: 0;\n  padding: 0;\n}',res:'كل الـ elements اتصفّر عندها الـ `margin` والـ `padding`'}
];
const names=['الـ selector ده إيه؟','الـ class ( . )','الـ id ( # )','الـ direct child ( > )','الـ first-child','الـ * ( النجمة )'];
const R=[['إزاي أختار class؟','`.box`','teal'],['إزاي أختار id؟','`#title`','orange'],['الـ `id` ينفع يتكرر؟','لأ، واحد بس في الصفحة','red'],['`div > p` معناها؟','الـ `p` اللي direct child بس','purple'],['`li:first-child` معناها؟','أول `li` جوه أبوه','green'],['الـ `*` بيختار إيه؟','كل الـ elements','blue']];
const slides=[
`<div class="slide active"><div class="glow-blob glow-blue" style="top:-120px;left:-120px"></div><div class="glow-blob glow-purple" style="bottom:-140px;right:-100px"></div><p class="slide-tag anim-1">درس CSS للمبتدئين</p><h1 class="anim-2">الـ <span class="rainbow-text">CSS Selectors</span><br>بكل <span class="highlight-teal">بساطة</span></h1><div class="rainbow-line anim-3"></div><p class="subtitle anim-4 mt-24">شرح سهل + مثال من الواقع + كود 👌</p></div>`,
`<div class="slide"><p class="slide-tag anim-1">خريطة الدرس</p><h2 class="anim-2">إيه اللي هنغطيه <span class="highlight-blue">النهاردة؟</span></h2><div class="topics-list anim-3">${names.map((n,i)=>`<div class="topic-item"><span class="topic-num">${i+1}</span>${K(n)}</div>`).join('')}</div></div>`,
...T.map(t=>`<div class="slide"><div class="glow-blob glow-${t.g}" style="top:-100px;right:-100px"></div><p class="slide-tag anim-1">${t.tag}</p><h2 class="anim-2">${t.h}</h2><p class="subtitle anim-3">${K(t.s)}</p><div class="card rw anim-3">🌍 ${K(t.rw)}</div><div class="pair anim-4">${win('index.html',t.html,'html')}${win('style.css',t.css,'css')}</div><p class="subtitle anim-5 mt-16">✅ ${K(t.res)}</p></div>`),
`<div class="slide"><p class="slide-tag anim-1">مراجعة</p><h2 class="anim-2">يلا نراجع <span class="highlight-blue">بسرعة</span> 📝</h2><div class="flip-grid anim-3">${R.map(r=>`<div class="flip-card" onclick="this.classList.toggle('flipped')"><div class="flip-front" style="border-color:var(--accent-${r[2]})"><div class="flip-title">${K(r[0])}</div><div class="flip-hint">click to flip</div></div><div class="flip-back" style="border-color:var(--accent-${r[2]})"><div class="flip-detail">${K(r[1])}</div></div></div>`).join('')}</div></div>`
];
document.getElementById('deck').innerHTML=slides.join('');
(function(){
  const sl=[...document.querySelectorAll('.slide')],nav=document.getElementById('slideNav'),pr=document.getElementById('progress'),ct=document.getElementById('counter');let cur=0;
  sl.forEach((s,i)=>{const d=document.createElement('div');d.className='nav-dot'+(i?'':' active');d.onclick=()=>go(i);nav.appendChild(d)});
  function go(i){if(i<0||i>=sl.length)return;sl[cur].classList.remove('active');cur=i;sl[cur].classList.add('active');[...nav.children].forEach((d,k)=>d.classList.toggle('active',k===cur));pr.style.width=((cur+1)/sl.length*100)+'%';ct.textContent=(cur+1)+' / '+sl.length}
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur-1);if(e.key==='ArrowLeft')go(cur+1);if(e.key===' '){e.preventDefault();go(cur+1)}if(e.key.toLowerCase()==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}});
  let x0=null;document.addEventListener('touchstart',e=>x0=e.touches[0].clientX);document.addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>80)go(d<0?cur+1:cur-1);x0=null});
  const pw=document.getElementById('particles');
  for(let p=0;p<18;p++){const el=document.createElement('div');el.className='particle';const z=2+Math.random()*4;el.style.cssText=`width:${z}px;height:${z}px;left:${Math.random()*100}%;animation-duration:${8+Math.random()*14}s;animation-delay:${Math.random()*10}s`;pw.appendChild(el)}
  pr.style.width=(100/sl.length)+'%';ct.textContent='1 / '+sl.length;
})();
</script>
</body>
</html>
