<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CSS Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#030b1f;--card:#0a1a3a;--line:#17408f;--cyan:#22e4ff;--blue:#1f7bff;--text:#e8f6ff;--ok:#2ee59d;--bad:#ff5d73;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(900px 500px at 50% -10%,#0b2a63 0%,var(--bg) 60%);color:var(--text);font-family:'Cairo',Tahoma,sans-serif;font-weight:800;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px}
header img{height:44px;width:44px;border-radius:10px;box-shadow:0 0 16px #1f7bff88}
#cnt{color:var(--cyan);font-weight:900}
#bar{height:5px;background:#0d2352}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));box-shadow:0 0 12px var(--cyan);transition:width .3s}
main{flex:1;overflow:auto;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:20px;max-width:900px;width:100%;margin:0 auto}
.tag{align-self:flex-start;background:linear-gradient(90deg,var(--blue),var(--cyan));color:#021030;border-radius:99px;padding:2px 16px;font-weight:900;font-size:15px}
h1{font-size:clamp(34px,8vw,64px);font-weight:900;background:linear-gradient(90deg,var(--cyan),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.3}
h2{font-size:clamp(22px,4.6vw,36px);font-weight:900;line-height:1.6}
p.sub{color:#9fc8ff;font-size:clamp(15px,3vw,20px);line-height:1.8}
.logo{width:min(250px,50vw);border-radius:28px;box-shadow:0 0 60px #1f7bff88;align-self:center}
.center{text-align:center;align-items:center}
code{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:Consolas,monospace;font-weight:700;background:#0d2352;color:var(--cyan);border-radius:8px;padding:0 8px}
pre{direction:ltr;text-align:left;background:#020817;border:2px solid var(--line);border-radius:14px;padding:14px 18px;font:700 clamp(14px,3vw,18px)/1.7 Consolas,monospace;color:#bfe8ff;overflow:auto;box-shadow:0 0 24px #1f7bff33}
.opts{display:grid;gap:12px;direction:ltr}
.opt span{flex:1;direction:ltr;text-align:left}
.opt{direction:ltr;text-align:left;justify-content:flex-start;display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:14px;color:var(--text);font:inherit;font-size:clamp(16px,3.4vw,22px);padding:12px 16px;cursor:pointer;text-align:start;transition:border-color .15s,box-shadow .15s}
.opt:hover{border-color:var(--cyan);box-shadow:0 0 18px #22e4ff44}
.opt.ar,.opt.ar span{direction:rtl;text-align:right}
.opt b{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#021030;font-weight:900}
.opt.ok{border-color:var(--ok);background:#0a3b33}
.opt.bad{border-color:var(--bad);background:#401428}
.exp{min-height:30px;color:var(--cyan);font-size:clamp(15px,3vw,20px);line-height:1.8}
.btn{font:inherit;font-weight:900;font-size:18px;border:0;border-radius:12px;padding:8px 22px;cursor:pointer;color:#021030;background:linear-gradient(90deg,var(--cyan),var(--blue))}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:default}
footer{display:flex;justify-content:space-between;padding:12px 20px}
.hide{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const f=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
const S=[
{t:'title'},
{t:'mc',q:'أنهي selector بيختار `<div class="box">` ؟',o:['#box','.box','box','*box'],a:1,e:'الـ class بنكتبه بنقطة ( . )'},
{t:'mc',q:'أنهي selector بيختار `<h1 id="title">` ؟',o:['.title','title','#title','*title'],a:2,e:'الـ id بنكتبه بـ hash ( # )'},
{t:'mc',q:'`div > p` بيختار إيه؟',o:['كل `p` جوه `div` في أي مستوى','بس الـ `p` اللي direct child لـ `div`','كل `div` وكل `p`','`div` جاي بعد `p`'],a:1,e:'علامة `>` معناها direct child بس'},
{t:'mc',q:'الـ `*` بيختار إيه؟',o:['أول element في الصفحة','`div` بس','كل الـ elements','اللي ليهم class بس'],a:2,e:'الـ `*` اسمه universal selector'},
{t:'tf',q:'الـ class ينفع يتستخدم على أكتر من element.',o:['True','False'],a:0,e:'تمام، الـ class بيتكرر عادي'},
{t:'tf',q:'الـ id المفروض يتستخدم على element واحد بس في الصفحة.',o:['True','False'],a:0,e:'الـ id لازم يبقى unique'},
{t:'tf',q:'`div p` و `div > p` دايماً بيختاروا نفس الـ elements.',o:['True','False'],a:1,e:'`div p` في أي مستوى، لكن `div > p` direct child بس'},
{t:'tf',q:'`p:first-child` بيختار أول `p` في الصفحة كلها.',o:['True','False'],a:1,e:'بيختار الـ `p` اللي هو أول child لأبوه، مش أول `p` في الصفحة'},
{t:'code',q:'خلّي أول `li` لونه أحمر.',c:'<ul>\n  <li>Apple</li>\n  <li>Banana</li>\n  <li>Cherry</li>\n</ul>',s:'li:first-child {\n  color: red;\n}'},
{t:'code',q:'استخدم `*` وصفّر الـ `margin` والـ `padding` لكل حاجة. بعدين خلّي الـ `p` اللي direct child لـ `.card` بس أزرق (مش اللي جوه `section`).',c:'<div class="card">\n  <p>One</p>\n  <section>\n    <p>Two</p>\n  </section>\n</div>',s:'* {\n  margin: 0;\n  padding: 0;\n}\n\n.card > p {\n  color: blue;\n}'},
{t:'end'}
];
const L={mc:'multi choice',tf:'True / False',code:'code challenge'};
const cnt={mc:0,tf:0,code:0};let qn=0;
S.forEach(s=>{if(L[s.t]){s.n=++qn}});
const picks={};let i=0;
const m=document.getElementById('m');
function mark(k){const s=S[i],p=picks[i];m.querySelectorAll('.opt').forEach((b,j)=>{if(j===s.a)b.classList.add('ok');else if(j===p)b.classList.add('bad')});m.querySelector('.exp').textContent=(p===s.a?'✅ صح! ':'❌ غلط. ')+s.e}
function render(){
const s=S[i];let h='';
if(s.t==='title')h=`<img class="logo" src="${LOGO}" alt="logo"><h1>CSS Quiz</h1><p class="sub">class · id · selector · direct child · first-child · *</p><p class="sub">10 أسئلة: 4 multi choice، 4 True / False، و 2 code challenges. يلا بينا!</p>`;
else if(s.t==='end'){let sc=0;for(const k in picks)if(picks[k]===S[k].a)sc++;h=`<img class="logo" src="${LOGO}" alt="logo" style="width:140px"><h1>خلصنا 🎉</h1><p class="sub">نتيجتك في الأسئلة اللي اتصححت: <code>${sc} / 8</code></p><p class="sub">كمّل تمرين على الـ selectors وهتبقى فاهمها صح.</p>`}
else if(s.t==='code')h=`<span class="tag">${L[s.t]} · سؤال ${s.n}</span><h2>${f(s.q)}</h2><pre>${esc(s.c)}</pre><button class="btn" id="sh" style="align-self:flex-start">اعرض الحل</button><pre class="hide" id="sol">${esc(s.s)}</pre>`;
else h=`<span class="tag">${L[s.t]} · سؤال ${s.n}</span><h2>${f(s.q)}</h2><div class="opts">${s.o.map((x,k)=>`<button class="opt${/[\u0600-\u06FF]/.test(x)?' ar':''}" data-k="${k}"><b>${s.t==='tf'?(k?'✗':'✓'):'ABCD'[k]}</b><span>${f(x)}</span></button>`).join('')}</div><div class="exp"></div>`;
m.className=(s.t==='title'||s.t==='end')?'center':'';
m.innerHTML=h;m.scrollTop=0;
document.getElementById('cnt').textContent=(i+1)+' / '+S.length;
document.querySelector('#bar i').style.width=((i+1)/S.length*100)+'%';
document.getElementById('pv').disabled=i===0;document.getElementById('nx').disabled=i===S.length-1;
if(picks[i]!==undefined&&(s.t==='mc'||s.t==='tf'))mark();
if(s.t==='mc'||s.t==='tf')m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(picks[i]!==undefined)return;picks[i]=+b.dataset.k;mark()});
if(s.t==='code')document.getElementById('sh').onclick=()=>document.getElementById('sol').classList.toggle('hide');
}
const go=d=>{const n=i+d;if(n>=0&&n<S.length){i=n;render()}};
document.getElementById('nx').onclick=()=>go(1);document.getElementById('pv').onclick=()=>go(-1);
document.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='PageDown')go(1);if(e.key==='ArrowRight'||e.key==='PageUp')go(-1)};
let x0=null;document.ontouchstart=e=>x0=e.touches[0].clientX;
document.ontouchend=e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>70)go(d<0?1:-1);x0=null};
render();
</script>
