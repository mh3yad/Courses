<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logarithm – الأصول الثلاثة – الفقرة 3</title>
<style>
:root{--bg:#0B1F3A;--card:#12294a;--ac:#FF7A1A;--tx:#fff;--mu:#9fb3cf;--ok:#2ecc71;--no:#e74c3c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Cairo","Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 18px}
header b{font-size:20px;letter-spacing:1px}header b span{color:var(--ac)}
.bar{height:5px;background:#1d3a63}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:.3s}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.s{width:100%;max-width:760px;background:var(--card);border-radius:20px;padding:26px;border-top:6px solid var(--ac)}
.tag{color:var(--ac);font-weight:700;font-size:14px}
h1{font-size:30px;margin:8px 0}h2{font-size:24px;margin:10px 0 18px;line-height:1.6}
p{color:var(--mu);font-size:18px;line-height:1.8}
.o{display:block;width:100%;text-align:start;margin:8px 0;padding:13px 16px;font:inherit;font-size:18px;color:var(--tx);background:#0e2342;border:2px solid #24456f;border-radius:12px;cursor:pointer}
.o:hover{border-color:var(--ac)}.o.ok{background:var(--ok);border-color:var(--ok)}.o.no{background:var(--no);border-color:var(--no)}
pre{direction:ltr;text-align:left;background:#07142a;padding:14px;border-radius:12px;font-size:18px;overflow-x:auto;color:#ffd7b3}
.btn{background:var(--ac);color:#fff;border:0;padding:12px 24px;font:inherit;font-size:18px;border-radius:12px;cursor:pointer;margin-top:12px}
footer{display:flex;justify-content:space-between;padding:12px 18px}
footer .btn{margin:0;padding:10px 22px}footer .btn:disabled{opacity:.35}
.big{font-size:64px;color:var(--ac);font-weight:800}
.fb{margin-top:12px;padding:12px 16px;border-radius:12px;font-size:18px;line-height:1.7;background:#0e2342;border-right:5px solid var(--ac)}.fb.g{border-color:var(--ok)}.fb.r{border-color:var(--no)}
.hero{position:relative;height:200px;border-radius:12px;background:linear-gradient(160deg,#1e6fd9,#6cc4ff 60%,#ffd9a0);overflow:hidden;margin:10px 0}.hero .logo{position:absolute;top:10px;right:12px;font-weight:800}.hero .b{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 22px;font:inherit}.hero .bx{position:absolute;top:62%;left:50%;transform:translateX(-50%);width:50%;height:60px;background:#fff;border-radius:8px}
.q{border-right:4px solid var(--ac);padding:8px 16px;font-size:21px;line-height:2;background:#0e2342;border-radius:10px;margin:12px 0}
</style>
</head>
<body>
<header>
<svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true"><circle cx="19" cy="19" r="18" fill="#FF7A1A"/><text x="19" y="25" font-size="17" font-weight="800" text-anchor="middle" fill="#0B1F3A" font-family="Arial">log</text></svg>
<b>LOG<span>ARITHM</span></b>
</header>
<div class="bar"><i id="pb"></i></div>
<main><div class="s" id="sl"></div></main>
<footer><button class="btn" id="nx">التالي ←</button><button class="btn" id="pv_">→ السابق</button></footer>
<script>
const E=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const Q=t=>`<h2 dir="rtl">${E(t)}</h2>`;
const mc=[
["الفقرة التالتة من الأصول الثلاثة بتبدأ بإيه؟",["اعلم أرشدك الله لطاعته","اعلم رحمك الله","بسم الله الرحمن الرحيم","والعصر"],0,"الفقرة التالتة بتبدأ بـ: اعلم أرشدك الله لطاعته."],
["الحنيفية هي ملة مين؟",["إبراهيم","موسى","نوح","داود"],0,"المصنف قال: الحنيفية ملة إبراهيم."],
["الحنيفية معناها إنك تعبد الله إزاي؟",["وحده مخلصاً له الدين","مع غيره","في المسجد بس","في الخفاء بس"],0,"الحنيفية: أن تعبد الله وحده مخلصاً له الدين."],
["مين اللي أمره الله بالحنيفية؟",["جميع الناس","المسلمين بس","العلماء بس","الأنبياء بس"],0,"المصنف قال: وبذلك أمر الله جميع الناس."],
["الله خلق الناس ليه؟",["ليعبدوه","للعب","للتجارة","للأكل بس"],0,"الله خلقهم للعبادة، زي ما قال في الآية."],
["الآية: ﴿وما خلقت الجن والإنس إلا ليعبدون﴾ من سورة إيه؟",["الذاريات","العصر","الفاتحة","الناس"],0,"الآية دي في سورة الذاريات."],
["الآية بتقول إن الله خلق مين؟",["الجن والإنس","الملائكة بس","الإنس بس","الحيوانات"],0,"الآية ذكرت الجن والإنس."],
["معنى (يعبدون) في الآية؟",["يوحدون","يسافرون","يتعلمون","يأكلون"],0,"المصنف فسّرها: ومعنى يعبدون: يوحدون."],
["إيه أعظم ما أمر الله به؟",["التوحيد","الصيام","السفر","التجارة"],0,"أعظم ما أمر الله به هو التوحيد."],
["التوحيد هو إيه؟",["إفراد الله بالعبادة","عبادة الله وغيره","ترك العبادة","كتابة الدعاء"],0,"التوحيد: إفراد الله بالعبادة، يعني نعبده هو وحده."],
["إيه أعظم ما نهى الله عنه؟",["الشرك","الكسل","السهر","الأكل"],0,"أعظم ما نهى الله عنه هو الشرك."],
["الشرك هو إيه؟",["دعوة غير الله معه","عبادة الله وحده","الصبر على الأذى","طلب العلم"],0,"الشرك: دعوة غيره معه."],
["إيه الدليل على الأمر بعبادة الله وعدم الشرك؟",["واعبدوا الله ولا تشركوا به شيئاً","والعصر إن الإنسان لفي خسر","الحمد لله رب العالمين","قل أعوذ برب الناس"],0,"الدليل اللي ذكره المصنف: ﴿واعبدوا الله ولا تشركوا به شيئاً﴾."],
["لو حد دعا غير الله مع الله، يبقى وقع في إيه؟",["الشرك","التوحيد","الحنيفية","الإخلاص"],0,"دعوة غير الله مع الله هي الشرك."],
["إيه عكس التوحيد؟",["الشرك","الصدق","العلم","الصبر"],0,"التوحيد إفراد الله بالعبادة، وعكسه الشرك."]];
const tf=[
["الحنيفية ملة إبراهيم.",true,"أيوه، دي أول جملة في الفقرة."],
["الله أمر المسلمين بس بعبادته وحده.",false,"الله أمر جميع الناس، مش المسلمين بس."],
["الله خلق الجن والإنس ليلعبوا.",false,"خلقهم ليعبدوه، يعني يوحدوه."],
["معنى (يعبدون) في الآية: يوحدون.",true,"أيوه، المصنف فسّر يعبدون بـ يوحدون."],
["الشرك هو دعوة غير الله مع الله.",true,"أيوه، ده تعريف الشرك في الفقرة."]];
const rnd=a=>a.map((_,j)=>j).sort(()=>Math.random()-.5);
const L=['a','b','c','d'];
const S=[()=>`<div class="tag">الأصول الثلاثة</div><h1>الفقرة الثالثة 📖</h1><div class="q">اعلم أرشدك الله لطاعته أن الحنيفية ملة إبراهيم: أن تعبد الله وحده مخلصاً له الدين، وبذلك أمر الله جميع الناس وخلقهم لها، كما قال تعالى: ﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ﴾. ومعنى يعبدون: يوحدون. وأعظم ما أمر الله به التوحيد وهو: إفراد الله بالعبادة، وأعظم ما نهى عنه الشرك وهو: دعوة غيره معه، والدليل قوله تعالى: ﴿وَاعْبُدُوا اللَّهَ وَلَا تُشْرِكُوا بِهِ شَيْئًا﴾.</div><p>15 اختيار من متعدد + 5 صح وغلط</p><button class="btn" onclick="go(1)">يلا نبدأ</button>`];
mc.forEach((q,n)=>{const k=rnd(q[1]);S.push(()=>`<div class="tag">اختيار من متعدد ${n+1}/${mc.length}</div>${Q(q[0])}`+k.map((j,x)=>`<button class="o" dir="rtl" onclick="pick(this,${j},${q[2]})">${L[x]}) ${E(q[1][j])}</button>`).join(""))});
tf.forEach((q,n)=>S.push(()=>`<div class="tag">صح ولا غلط ${n+1}/${tf.length}</div>${Q(q[0])}<button class="o" onclick="pick(this,1,${q[1]?1:0})">✅ صح</button><button class="o" onclick="pick(this,0,${q[1]?1:0})">❌ غلط</button>`));
const tot=mc.length+tf.length;
S.push(()=>`<div class="tag">النتيجة</div><div class="big">${sc} / ${tot}</div><h2>${sc/tot>=.8?"ممتاز! 🔥":sc/tot>=.5?"كويس، كمّل 👍":"راجع الفقرة وجرّب تاني 💪"}</h2><button class="btn" onclick="sc=0;done={};go(-i)">ابدأ من الأول</button>`);
let i=0,sc=0,done={};
function pick(b,j,c){if(done[i])return;done[i]=1;const p=b.parentNode,bs=[...p.querySelectorAll('.o')],ok=j==c;if(ok){sc++;b.classList.add('ok')}else{b.classList.add('no');const t=bs.find(x=>x.getAttribute('onclick').startsWith(`pick(this,${c},`));t&&t.classList.add('ok')}
const ex=i<=mc.length?mc[i-1][3]:tf[i-mc.length-1][2];const d=document.createElement('div');d.className='fb '+(ok?'g':'r');d.textContent=(ok?'✅ صح! ':'❌ غلط. ')+ex;p.appendChild(d)}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));r()}
function r(){sl.innerHTML=S[i]();pb.style.width=(i/(S.length-1)*100)+'%';pv_.disabled=i==0;nx.disabled=i==S.length-1}
nx.onclick=()=>go(1);pv_.onclick=()=>go(-1);
addEventListener('keydown',e=>{if(e.key=='ArrowLeft')go(1);if(e.key=='ArrowRight')go(-1)});
r();
</script>
</body>
</html>
