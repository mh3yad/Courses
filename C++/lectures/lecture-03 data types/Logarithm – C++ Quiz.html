<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logarithm – C++ Quiz</title>
<style>
:root{--bg:#0B1F3A;--card:#12294a;--ac:#FF7A1A;--tx:#fff;--mu:#9fb3cf;--ok:#2ecc71;--no:#e74c3c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Cairo","Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 18px}
header b{font-size:20px;letter-spacing:1px}header b span{color:var(--ac)}
.bar{height:5px;background:#1d3a63}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:.3s}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.s{width:100%;max-width:760px;background:var(--card);border-radius:20px;padding:26px;border-top:6px solid var(--ac)}
.tag{color:var(--ac);font-weight:700;font-size:14px}
h1{font-size:30px;margin:8px 0}h2{font-size:24px;margin:10px 0 18px;line-height:1.5}
p{color:var(--mu);font-size:18px}
.o{display:block;width:100%;text-align:start;margin:8px 0;padding:13px 16px;font:inherit;font-size:18px;color:var(--tx);background:#0e2342;border:2px solid #24456f;border-radius:12px;cursor:pointer}
.o:hover{border-color:var(--ac)}.o.ok{background:var(--ok);border-color:var(--ok)}.o.no{background:var(--no);border-color:var(--no)}
.o[dir=ltr]{text-align:left}
pre{direction:ltr;text-align:left;background:#07142a;padding:14px;border-radius:12px;font-size:17px;overflow-x:auto;color:#ffd7b3}
.btn{background:var(--ac);color:#fff;border:0;padding:12px 24px;font:inherit;font-size:18px;border-radius:12px;cursor:pointer;margin-top:12px}
.sol{display:none}.sol.show{display:block}
footer{display:flex;justify-content:space-between;padding:12px 18px;gap:10px}
footer .btn{margin:0;padding:10px 22px}footer .btn:disabled{opacity:.35}
.big{font-size:64px;color:var(--ac);font-weight:800}
</style>
</head>
<body>
<header>
<svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true"><circle cx="19" cy="19" r="18" fill="#FF7A1A"/><text x="19" y="25" font-size="17" font-weight="800" text-anchor="middle" fill="#0B1F3A" font-family="Arial">log</text></svg>
<b>LOG<span>ARITHM</span></b>
</header>
<div class="bar"><i id="pb"></i></div>
<main><div class="s" id="sl"></div></main>
<footer><button class="btn" id="nx">التالي ←</button><button class="btn" id="pv">→ السابق</button></footer>
<script>
const E=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const Q=t=>{const p=t.split("\n");return `<h2 dir="rtl">${E(p[0])}</h2>`+(p[1]?`<pre>${E(p.slice(1).join("\n"))}</pre>`:"")};
const mc=[
["أنهي نوع بيخزن رقم صحيح زي 5؟",["int","string","float","bool"],0],
["أنهي نوع بيخزن كلام زي \"Ahmed\"؟",["int","string","long long","float"],1],
["الرقم 3.14 بيتخزن في؟",["int","float","string","char"],1],
["إحنا بنستخدم long long ليه؟",["للكلام","للأرقام الكبيرة أوي","للكسور بس","للحروف"],1],
["إيه ناتج الكود ده؟\nint x = 7 / 2; cout << x;",["3.5","4","3","2"],2],
["إزاي بنكتب string صح؟",["'Hello'","Hello","\"Hello\"","(Hello)"],2],
["إيه ناتج الكود ده؟\nfloat f = 5; cout << f;",["5","5.5","error","0"],0]];
const tf=[
["int ممكن يخزن 3.5 زي ما هو.",false],
["long long أكبر من int.",true],
["float بيخزن أرقام فيها كسور.",true],
];
const cc=[
["عرّف متغير int بالقيمة دي واطبعه:\nage = 20","int age = 20;\ncout << age;"],
["عرّف متغير string بالقيمة دي واطبع Hello Omar:\nname = \"Omar\"","string name = \"Omar\";\ncout << \"Hello \" << name;"],
["عرّف متغير long long بالقيمة دي واطبعه:\nbig = 10000000000","long long big = 10000000000;\ncout << big;"],
["عرّف متغير float بالقيمة دي واطبع ضربها في 2:\npi = 3.14","float pi = 3.14;\ncout << pi * 2;"]];
const L=['a','b','c','d'];
const S=[];
S.push(()=>`<div class="tag">C++ Basics</div><h1>اختبار C++ بسيط 😎</h1><p>17 سؤال: 7 اختيارات، 3 صح وغلط، 4 تحديات كود<br>المواضيع: int ، string ، long long ، float</p><button class="btn" onclick="go(1)">يلا نبدأ</button>`);
mc.forEach((q,i)=>S.push(()=>`<div class="tag">اختيار من متعدد ${i+1}/${mc.length}</div>${Q(q[0])}`+q[1].map((o,j)=>`<button class="o" dir="ltr" onclick="pick(this,${j},${q[2]})">${L[j]}) ${E(o)}</button>`).join("")));
tf.forEach((q,i)=>S.push(()=>`<div class="tag">صح ولا غلط ${i+1}/${tf.length}</div>${Q(q[0])}<button class="o" onclick="pick(this,1,${q[1]?1:0})">✅ صح</button><button class="o" onclick="pick(this,0,${q[1]?1:0})">❌ غلط</button>`));
cc.forEach((q,i)=>S.push(()=>`<div class="tag">تحدي كود ${i+1}/${cc.length}</div>${Q(q[0])}<p>جرّب تكتبه في دماغك الأول 🧠</p><button class="btn" onclick="this.nextElementSibling.classList.add('show');this.style.display='none'">أظهر الحل</button><div class="sol"><pre>${E(q[1])}</pre></div>`));
S.push(()=>`<div class="tag">النتيجة</div><div class="big">${sc} / ${mc.length+tf.length}</div><p>(التحديات مش محسوبة في الدرجة)</p><h2>${sc/(mc.length+tf.length)>=.8?"جامد جداً! 🔥":sc/(mc.length+tf.length)>=.5?"كويس، كمّل 👍":"ولا يهمك، راجع وجرّب تاني 💪"}</h2><button class="btn" onclick="sc=0;done={};go(-i)">ابدأ من الأول</button>`);
let i=0,sc=0,done={};
function pick(b,j,c){if(done[i])return;done[i]=1;const bs=[...b.parentNode.querySelectorAll('.o')];if(j==c){sc++;b.classList.add('ok')}else{b.classList.add('no');const k=mc[i-1]?c:(c?0:1);bs[k]&&bs[k].classList.add('ok')}}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));r()}
function r(){document.getElementById('sl').innerHTML=S[i]();document.getElementById('pb').style.width=(i/(S.length-1)*100)+'%';pv.disabled=i==0;nx.disabled=i==S.length-1}
nx.onclick=()=>go(1);pv.onclick=()=>go(-1);
addEventListener('keydown',e=>{if(e.key=='ArrowLeft')go(1);if(e.key=='ArrowRight')go(-1)});
r();
</script>
</body>
</html>
