<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logarithm – HTML Media Quiz</title>
<style>
:root{--bg:#0B1F3A;--card:#12294a;--ac:#FF7A1A;--tx:#fff;--mu:#9fb3cf;--ok:#2ecc71;--no:#e74c3c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Cairo","Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 18px}
header b{font-size:20px;letter-spacing:1px}header b span{color:var(--ac)}
.bar{height:5px;background:#1d3a63}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:.3s}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.s{width:100%;max-width:760px;background:var(--card);border-radius:20px;padding:26px;border-top:6px solid var(--ac)}
.tag{color:var(--ac);font-weight:700;font-size:14px}
h1{font-size:30px;margin:8px 0}h2{font-size:24px;margin:10px 0 18px;line-height:1.6}
p{color:var(--mu);font-size:18px;line-height:1.8}
.o{display:block;width:100%;text-align:start;margin:8px 0;padding:13px 16px;font:inherit;font-size:18px;color:var(--tx);background:#0e2342;border:2px solid #24456f;border-radius:12px;cursor:pointer}
.o:hover{border-color:var(--ac)}.o.ok{background:var(--ok);border-color:var(--ok)}.o.no{background:var(--no);border-color:var(--no)}
pre{direction:ltr;text-align:left;background:#07142a;padding:14px;border-radius:12px;font-size:18px;overflow-x:auto;color:#ffd7b3}
.btn{background:var(--ac);color:#fff;border:0;padding:12px 24px;font:inherit;font-size:18px;border-radius:12px;cursor:pointer;margin-top:12px}
footer{display:flex;justify-content:space-between;padding:12px 18px}
footer .btn{margin:0;padding:10px 22px}footer .btn:disabled{opacity:.35}
.big{font-size:64px;color:var(--ac);font-weight:800}
.fb{margin-top:12px;padding:12px 16px;border-radius:12px;font-size:18px;line-height:1.7;background:#0e2342;border-right:5px solid var(--ac)}.fb.g{border-color:var(--ok)}.fb.r{border-color:var(--no)}
.hero{position:relative;height:200px;border-radius:12px;background:linear-gradient(160deg,#1e6fd9,#6cc4ff 60%,#ffd9a0);overflow:hidden;margin:10px 0}.hero .logo{position:absolute;top:10px;right:12px;font-weight:800}.hero .b{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 22px;font:inherit}.hero .bx{position:absolute;top:62%;left:50%;transform:translateX(-50%);width:50%;height:60px;background:#fff;border-radius:8px}
.bl{font:inherit;color:#fff;background:#0e2342;border:2px dashed var(--ac);border-radius:6px;padding:0 6px;text-align:center;outline:none;width:auto}.bl.g{border:2px solid var(--ok);background:rgba(46,204,113,.28);color:#bff5d3}
.sol{display:none}.sol.show{display:block}
</style>
</head>
<body>
<header>
<svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true"><circle cx="19" cy="19" r="18" fill="#FF7A1A"/><text x="19" y="25" font-size="17" font-weight="800" text-anchor="middle" fill="#0B1F3A" font-family="Arial">log</text></svg>
<b>LOG<span>ARITHM</span></b>
</header>
<div class="bar"><i id="pb"></i></div>
<main><div class="s" id="sl"></div></main>
<footer><button class="btn" id="nx">التالي ←</button><button class="btn" id="pv_">→ السابق</button></footer>
<script>
const E=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const Q=t=>{const p=t.split("\n");return `<h2 dir="rtl">${E(p[0])}</h2>`+(p[1]?`<pre>${E(p.slice(1).join("\n"))}</pre>`:"")};
const mc=[
["أنهي تاج بيعرض صورة؟",["<img>","<video>","<audio>","<a>"],0,"img هو تاج الصورة."],
["أنهي خاصية بنكتب فيها مكان الملف؟",["src","href","link","name"],0,"src (source) هي اللي بنكتب فيها مكان الملف."],
["أنهي تاج بيشغّل فيديو؟",["<video>","<img>","<audio>","<p>"],0,"video هو تاج الفيديو."],
["أنهي تاج بيشغّل صوت؟",["<audio>","<video>","<img>","<h1>"],0,"audio هو تاج الصوت."],
["الصورة في الكود ده جاية منين؟\n<img src=\"photo.jpg\">",["من ملف جنب صفحة HTML (local)","من النت (remote)","من الفيديو","مفيش صورة"],0,"photo.jpg اسم ملف بس، يعني local جنب الصفحة."],
["الصورة في الكود ده جاية منين؟\n<img src=\"https://example.com/cat.jpg\">",["من النت (remote)","من ملف جنب الصفحة (local)","من الصوت","مفيش صورة"],0,"اللينك الكامل اللي بيبدأ بـ https:// يبقى remote."],
["أنهي تاج بنكتبه جوه video أو audio عشان نحط الملف؟",["<source>","<img>","<a>","<p>"],0,"source هو التاج اللي جواه src ومكان الملف."],
["اللينك الـ remote بيبدأ بإيه؟",["https://","photo","C:","./"],0,"عنوان النت بيبدأ بـ https://"],
["أنهي كود صح للفيديو؟",["<video controls><source src=\"movie.mp4\"></video>","<video controls><source href=\"movie.mp4\"></video>","<video controls><movie src=\"movie.mp4\"></video>","<video controls><link src=\"movie.mp4\"></video>"],0,"الفيديو بنحط جواه source وفيه src. وcontrols بتظهر أزرار التشغيل."],
["أنهي كود صح للصوت؟",["<audio controls><source src=\"song.mp3\"></audio>","<audio controls><source href=\"song.mp3\"></audio>","<audio controls><sound src=\"song.mp3\"></audio>","<audio controls><link src=\"song.mp3\"></audio>"],0,"الصوت بنحط جواه source وفيه src. وcontrols بتظهر أزرار التشغيل."]];
const tf=[
["src فيها مكان الملف.",true,"أيوه، src بتقول الملف فين."],
["الكود ده بيعرض فيديو:\n<audio controls><source src=\"movie.mp4\"></audio>",false,"audio للصوت. الفيديو تاجه video."],
["الكود ده فيه صورة remote:\n<img src=\"https://site.com/a.jpg\">",true,"أيوه، اللينك الكامل بـ https:// يبقى remote."],
["بنكتب مكان الصورة في href.",false,"الصورة بتستخدم src، مش href."],
["بنكتب source جوه تاج video عشان نحط ملف الفيديو.",true,"أيوه، source جوه video وفيه src."]];
const cc=[
["كمّل الخاصية اللي بتحط مكان الصورة (local):\n<img ___=\"photo.jpg\">","<img src=\"photo.jpg\">","src هي الخاصية اللي فيها مكان الملف.",["src"]],
["كمّل أول اللينك (remote):\n<img src=\"___://example.com/cat.jpg\">","<img src=\"https://example.com/cat.jpg\">","اللينك على النت بيبدأ بـ https",["https"]],
["كمّل التاج اللي جوه الفيديو:\n<video controls>\n  <___ src=\"movie.mp4\">\n</video>","<video controls>\n  <source src=\"movie.mp4\">\n</video>","source جوه video، وفيه src ومكان الملف.",["source"]],
["كمّل تاج الصوت:\n<___ controls>\n  <source src=\"song.mp3\">\n</audio>","<audio controls>\n  <source src=\"song.mp3\">\n</audio>","تاج الصوت audio، وجواه source.",["audio"]],
["كمّل الصفحة كلها:\n<img src=\"photo.jpg\">\n<video controls>\n  <___ src=\"movie.mp4\">\n</video>\n<audio controls>\n  <source ___=\"https://example.com/song.mp3\">\n</audio>","<img src=\"photo.jpg\">\n<video controls>\n  <source src=\"movie.mp4\">\n</video>\n<audio controls>\n  <source src=\"https://example.com/song.mp3\">\n</audio>","source جوه video وaudio، وsrc فيها مكان الملف سواء local أو remote.",["source","src"]]];
const rnd=a=>a.map((_,j)=>j).sort(()=>Math.random()-.5);
const L=['a','b','c','d'];
const S=[()=>`<div class="tag">HTML Media</div><h1>اختبار الصور والفيديو والصوت 🖼️</h1><p>10 اختيارات + 5 صح وغلط + 5 تحديات كود<br>المواضيع: img ، video ، audio ، source ، src (local و remote)</p><button class="btn" onclick="go(1)">يلا نبدأ</button>`];
mc.forEach((q,n)=>{const k=rnd(q[1]);S.push(()=>`<div class="tag">اختيار من متعدد ${n+1}/${mc.length}</div>${Q(q[0])}`+k.map((j,x)=>{const o=E(q[1][j]),ar=/[\u0600-\u06FF]/.test(o);return `<button class="o" dir="${ar?'rtl':'ltr'}" onclick="pick(this,${j},${q[2]})">${L[x]}) ${o}</button>`}).join(""))});
tf.forEach((q,n)=>S.push(()=>`<div class="tag">صح ولا غلط ${n+1}/${tf.length}</div>${Q(q[0])}<button class="o" onclick="pick(this,1,${q[1]?1:0})">✅ صح</button><button class="o" onclick="pick(this,0,${q[1]?1:0})">❌ غلط</button>`));
const tot=mc.length+tf.length;
S.push(()=>`<div class="tag">النتيجة</div><div class="big">${sc} / ${tot}</div><h2>${sc/tot>=.8?"جامد جداً! 🔥":sc/tot>=.5?"كويس، كمّل 👍":"ولا يهمك، راجع وجرّب تاني 💪"}</h2><p>(تحديات الكود مش محسوبة في الدرجة)</p><button class="btn" onclick="go(1)">تحديات الكود 🚀</button>`);
cc.forEach((q,n)=>S.push(()=>{const p=q[0].split("\n"),an=q[3];let k=0;const code=E(p.slice(1).join("\n")).replace(/___/g,()=>{const a=an[k++];return `<input class="bl" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" size="${a.split('|')[0].length+2}" data-a="${E(a)}" oninput="chk(this)">`});return `<div class="tag">تحدي كود ${n+1}/${cc.length}</div><h2 dir="rtl">${E(p[0])}</h2><div id="cd"><pre>${code}</pre></div><div class="fb g done" style="display:none">🎉 برافو! كل الفراغات صح. ${E(q[2])}</div><button class="btn" onclick="this.nextElementSibling.classList.add('show');this.style.display='none'">أظهر الحل</button><div class="sol"><pre>${E(q[1])}</pre></div>`}));
S.push(()=>`<div class="tag">خلصنا 🎉</div><h2>برافو! عملت صفحة فيها صورة وفيديو وصوت</h2><button class="btn" onclick="sc=0;done={};go(-i)">ابدأ من الأول</button>`);
function chk(el){const nz=x=>x.replace(/\s+/g,'');el.classList.toggle('g',el.dataset.a.split('|').some(a=>nz(a)===nz(el.value)));const all=[...document.querySelectorAll('.bl')];document.querySelector('.done').style.display=all.every(x=>x.classList.contains('g'))?'block':'none'}
let i=0,sc=0,done={};
function pick(b,j,c){if(done[i])return;done[i]=1;const p=b.parentNode,bs=[...p.querySelectorAll('.o')],ok=j==c;if(ok){sc++;b.classList.add('ok')}else{b.classList.add('no');const t=bs.find(x=>x.getAttribute('onclick').startsWith(`pick(this,${c},`));t&&t.classList.add('ok')}
const ex=i<=mc.length?mc[i-1][3]:tf[i-mc.length-1][2];const d=document.createElement('div');d.className='fb '+(ok?'g':'r');d.textContent=(ok?'✅ صح! ':'❌ غلط. ')+ex;p.appendChild(d)}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));r()}
function r(){sl.innerHTML=S[i]();pb.style.width=(i/(S.length-1)*100)+'%';pv_.disabled=i==0;nx.disabled=i==S.length-1}
nx.onclick=()=>go(1);pv_.onclick=()=>go(-1);
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;if(e.key=='ArrowLeft')go(1);if(e.key=='ArrowRight')go(-1)});
r();
</script>
</body>
</html>
